# Benchmark isolado — UMA execução por disparo (T4; plano em
# thesis-workspace/planejamento/atual/plano-t4-pipeline-2026-10-03.md).
#
# Só disparo manual: sem push, sem agenda, sem matriz — nenhum gasto automático. Cada disparo:
#   preparar        entradas, commits por SHA, identidade (site, referência, plano, oráculo) → manifesto
#   coleta          imagens nesta VM (versões = lock travado) → run-once → pacote (sobe mesmo com falha)
#   linhas-de-base  mesmo site e manifesto, separado da coleta; axe + validator (não guiado comparável,
#                   guiado diagnóstico) + ESLint como já era → registro baseline.v1
#   arquivar        único job com escrita no govbr-resultados; caminho imutável, índice, anexo na Release
#
# Segredos (Settings → Secrets and variables → Actions), cada um só onde é usado:
#   GOVBR_LEITURA_TOKEN      PAT fine-grained, Contents: Read-only em govbr-telas, govbr-ds-validator, govbr-corpus
#   GOVBR_RESULTADOS_TOKEN   PAT fine-grained, Contents: Read and write SÓ em govbr-resultados (job arquivar)
#   GOVBR_RESULTADOS_LEITURA_TOKEN  PAT fine-grained, Contents: Read-only SÓ em govbr-resultados (job preparar,
#                            campanha com agenda: lê indice/entradas para contar tentativas; a coleta nunca o vê)
#   CLAUDE_CODE_OAUTH_TOKEN  `claude setup-token` da assinatura (SÓ no passo da coleta real)
#   CLAUDE_CODE_OAUTH_TOKEN_2  idem, da segunda conta; usado quando o disparo escolhe conta = segunda
# Toda lógica está em scripts/ci/t4.sh e scripts/*.ts; entradas chegam por env, nunca interpoladas no shell.
name: execucao-isolada

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "real = modelo real (custa); duble = cliente real contra dublê; roteirizado = agente roteirizado (ensaios, sem modelo)"
        type: choice
        options: [roteirizado, duble, real]
        default: roteirizado
      tela:
        description: "tela A (solicitacao) ou B (vistorias)"
        type: choice
        options: [solicitacao, vistorias]
        default: solicitacao
      braco:
        description: "sem, com (oráculo, perfil evaluation) ou ferramentas (oráculo, perfil knowledge-free) — da-agenda = o braço do slot; campanha sem agenda exige um dos três"
        type: choice
        options: [da-agenda, sem, com, ferramentas]
        default: da-agenda
      modelo:
        description: "id EXATO do modelo (só modo real; vazio = o da campanha com agenda)"
        type: string
        default: ""
      esforco:
        description: "esforço do cliente (só modo real; da-campanha = o congelado, ou high sem agenda)"
        type: choice
        options: [da-campanha, high, medium, low, xhigh, max]
        default: da-campanha
      limite_min:
        description: "teto de tempo do agente, minutos (1–90; vazio = o da campanha com agenda, ou 90)"
        type: string
        default: ""
      campanha:
        description: "id da campanha"
        type: string
        required: true
      slot:
        description: "id do slot da agenda (campanha com agenda: só ele basta)"
        type: string
        required: true
      par:
        description: "id do par/trio (vazio = o do slot na agenda, ou par-01)"
        type: string
        default: ""
      tentativa:
        description: "tentativa do slot (vazio = a que o índice do arquivo dá, com agenda; ou 1). Nova tentativa só por falha técnica"
        type: string
        default: ""
      repeticao:
        description: "repetição (vazio = a do slot na agenda, ou 1)"
        type: string
        default: ""
      telas_sha:
        description: "commit (40 hex) do govbr-telas"
        type: string
        required: true
      validator_sha:
        description: "commit (40 hex) do govbr-ds-validator"
        type: string
        required: true
      etapas:
        description: "o que rodar neste disparo"
        type: choice
        options: [coleta+linha-de-base, so-coleta, so-linha-de-base]
        default: coleta+linha-de-base
      refazer_linha_de_base_de:
        description: "repetição técnica da linha de base: baselineId anterior (só com so-linha-de-base)"
        type: string
        default: ""
      motivo_refazer:
        description: "motivo da repetição técnica da linha de base"
        type: string
        default: ""
      conta:
        description: "assinatura Claude que paga a coleta real (principal = CLAUDE_CODE_OAUTH_TOKEN, segunda = CLAUDE_CODE_OAUTH_TOKEN_2)"
        type: choice
        options: [principal, segunda]
        default: principal

permissions: {}

concurrency:
  group: execucao-isolada
  cancel-in-progress: false

jobs:
  preparar:
    name: Preparar (entradas, commits, identidade)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      agente: ${{ steps.entradas.outputs.agente }}
      egress: ${{ steps.entradas.outputs.egress }}
      modelo: ${{ steps.entradas.outputs.modelo }}
      esforco: ${{ steps.entradas.outputs.esforco }}
      imagens: ${{ steps.entradas.outputs.imagens }}
      coleta: ${{ steps.entradas.outputs.coleta }}
      linha_de_base: ${{ steps.entradas.outputs.linha_de_base }}
      limite_seg: ${{ steps.entradas.outputs.limite_seg }}
      corpus_sha: ${{ steps.manifesto.outputs.corpus_sha }}
      # NAT-65: resolvidos no preparar (agenda/campanha/índice); os jobs seguintes usam estes, nunca os digitados
      braco: ${{ steps.entradas.outputs.braco }}
      par: ${{ steps.entradas.outputs.par }}
      repeticao: ${{ steps.entradas.outputs.repeticao }}
      tentativa: ${{ steps.manifesto.outputs.tentativa }}
    steps:
      - name: Checkout govbr-eval (commit do disparo)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: govbr-eval
          persist-credentials: false
      - name: Node 24.21.0 (o mesmo das imagens)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"
      - name: Dependências do govbr-eval
        run: bash govbr-eval/scripts/ci/t4.sh instalar-eval
      - name: Conferir entradas
        id: entradas
        env:
          ENTRADAS: ${{ toJSON(inputs) }}
        run: bash govbr-eval/scripts/ci/t4.sh entradas
      - name: Checkout govbr-telas (por SHA)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: nathlia/govbr-telas
          ref: ${{ inputs.telas_sha }}
          path: govbr-telas
          token: ${{ secrets.GOVBR_LEITURA_TOKEN }}
          persist-credentials: false
      - name: Checkout govbr-ds-validator (por SHA)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: nathlia/govbr-ds-validator
          ref: ${{ inputs.validator_sha }}
          path: govbr-ds-validator
          token: ${{ secrets.GOVBR_LEITURA_TOKEN }}
          persist-credentials: false
      - name: Compilar o oráculo (dist/ conferido contra o lock)
        run: bash govbr-eval/scripts/ci/t4.sh compilar-validador
      # Campanha com agenda (NAT-65): só o índice (indice/entradas), só leitura, só neste job — para contar as
      # tentativas do slot. Nenhum resultado sai daqui para a coleta (as saídas do job são ids e valores congelados).
      - name: Índice do arquivo (só campanha com agenda; leitura esparsa)
        if: steps.entradas.outputs.agenda == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: nathlia/govbr-resultados
          ref: main
          path: govbr-resultados
          token: ${{ secrets.GOVBR_RESULTADOS_LEITURA_TOKEN }}
          persist-credentials: false
          sparse-checkout: indice/entradas
      - name: Manifesto de coleta (identidade antes de qualquer gasto)
        id: manifesto
        env:
          TELA: ${{ inputs.tela }}
          BRACO: ${{ steps.entradas.outputs.braco }}
          MODO: ${{ inputs.modo }}
          MODELO: ${{ steps.entradas.outputs.modelo }}
          ESFORCO: ${{ steps.entradas.outputs.esforco }}
          LIMITE_MIN: ${{ steps.entradas.outputs.limite_min }}
          CAMPANHA: ${{ inputs.campanha }}
          SLOT: ${{ inputs.slot }}
          PAR: ${{ steps.entradas.outputs.par }}
          TENTATIVA: ${{ steps.entradas.outputs.tentativa }}
          REPETICAO: ${{ steps.entradas.outputs.repeticao }}
        run: bash govbr-eval/scripts/ci/t4.sh manifesto
      - name: Guardar o manifesto (nunca vai ao job da coleta)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manifesto-coleta
          path: ${{ runner.temp }}/manifesto/
          retention-days: 14
          if-no-files-found: error

  coleta:
    name: Coleta (uma execução isolada)
    needs: preparar
    if: needs.preparar.outputs.coleta == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      # Checkout ESPARSO: nem gabarito, nem auditorias das telas, nem resultados anteriores no disco da coleta.
      - name: Checkout govbr-eval (commit do disparo, sem gabaritos)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: govbr-eval
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/ground-truth*.json
            !/organic-ground-truth.json
            !/adjudications.json
            !/checker-aliases.json
            !/results/
            !/reports/
            !/tela-a/
            !/tela-b/
            !/dashboard/
      - name: Node 24.21.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"
      - name: Checkout govbr-telas (por SHA)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: nathlia/govbr-telas
          ref: ${{ inputs.telas_sha }}
          path: govbr-telas
          token: ${{ secrets.GOVBR_LEITURA_TOKEN }}
          persist-credentials: false
      # Braço sem: o pacote do oráculo nem é baixado. com e ferramentas usam a mesma imagem (NAT-61).
      - name: Checkout govbr-ds-validator (por SHA; só nos braços com oráculo)
        if: needs.preparar.outputs.braco == 'com' || needs.preparar.outputs.braco == 'ferramentas'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: nathlia/govbr-ds-validator
          ref: ${{ inputs.validator_sha }}
          path: govbr-ds-validator
          token: ${{ secrets.GOVBR_LEITURA_TOKEN }}
          persist-credentials: false
      - name: Dependências do govbr-eval
        run: bash govbr-eval/scripts/ci/t4.sh instalar-eval
      - name: Compilar o oráculo (só nos braços com oráculo)
        if: needs.preparar.outputs.braco == 'com' || needs.preparar.outputs.braco == 'ferramentas'
        run: bash govbr-eval/scripts/ci/t4.sh compilar-validador
      - name: Imagens nesta VM (versões = lock travado)
        env:
          IMAGENS: ${{ needs.preparar.outputs.imagens }}
        run: bash govbr-eval/scripts/ci/t4.sh imagens
      - name: Nenhuma credencial de GitHub/publicação no passo nem nos checkouts
        run: bash govbr-eval/scripts/ci/t4.sh conferir-ambiente
      # Único passo com a credencial do provedor; o run-once a repassa só ao contêiner do agente (-e NOME).
      - name: Coleta com o modelo real
        id: coleta_real
        if: inputs.modo == 'real'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.conta == 'segunda' && secrets.CLAUDE_CODE_OAUTH_TOKEN_2 || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TELA: ${{ inputs.tela }}
          BRACO: ${{ needs.preparar.outputs.braco }}
          MODO: ${{ inputs.modo }}
          AGENTE: ${{ needs.preparar.outputs.agente }}
          EGRESS: ${{ needs.preparar.outputs.egress }}
          MODELO: ${{ needs.preparar.outputs.modelo }}
          ESFORCO: ${{ needs.preparar.outputs.esforco }}
          LIMITE_SEG: ${{ needs.preparar.outputs.limite_seg }}
          CAMPANHA: ${{ inputs.campanha }}
          SLOT: ${{ inputs.slot }}
          PAR: ${{ needs.preparar.outputs.par }}
          TENTATIVA: ${{ needs.preparar.outputs.tentativa }}
          REPETICAO: ${{ needs.preparar.outputs.repeticao }}
        run: bash govbr-eval/scripts/ci/t4.sh coleta
      - name: Coleta de ensaio (sem modelo, sem credencial)
        id: coleta_ensaio
        if: inputs.modo != 'real'
        env:
          TELA: ${{ inputs.tela }}
          BRACO: ${{ needs.preparar.outputs.braco }}
          MODO: ${{ inputs.modo }}
          AGENTE: ${{ needs.preparar.outputs.agente }}
          EGRESS: ${{ needs.preparar.outputs.egress }}
          MODELO: ${{ needs.preparar.outputs.modelo }}
          ESFORCO: ${{ needs.preparar.outputs.esforco }}
          LIMITE_SEG: ${{ needs.preparar.outputs.limite_seg }}
          CAMPANHA: ${{ inputs.campanha }}
          SLOT: ${{ inputs.slot }}
          PAR: ${{ needs.preparar.outputs.par }}
          TENTATIVA: ${{ needs.preparar.outputs.tentativa }}
          REPETICAO: ${{ needs.preparar.outputs.repeticao }}
        run: bash govbr-eval/scripts/ci/t4.sh coleta
      - name: Ambiente dos contêineres sem tokens de GitHub/publicação
        if: always()
        env:
          MODO: ${{ inputs.modo }}
        run: bash govbr-eval/scripts/ci/t4.sh conferir-ambiente-pacote
      # Cartão de saúde no topo (NAT-58); as tabelas técnicas ficam dobradas.
      - name: Resumo da coleta
        if: always()
        env:
          CAMPANHA: ${{ inputs.campanha }}
          SLOT: ${{ inputs.slot }}
          PAR: ${{ needs.preparar.outputs.par }}
          TENTATIVA: ${{ needs.preparar.outputs.tentativa }}
          TELA: ${{ inputs.tela }}
          BRACO: ${{ needs.preparar.outputs.braco }}
          MODELO: ${{ needs.preparar.outputs.modelo }}
          ESFORCO: ${{ needs.preparar.outputs.esforco }}
          ETAPAS: ${{ inputs.etapas }}
        run: bash govbr-eval/scripts/ci/t4.sh resumo-coleta
      - name: Subir o pacote (também em falha)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pacote
          path: ${{ runner.temp }}/pacote/
          retention-days: 14
          if-no-files-found: warn

  linhas-de-base:
    name: Linhas de base (mesmo site, mesmo manifesto)
    needs: preparar
    if: needs.preparar.outputs.linha_de_base == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout govbr-eval (commit do disparo)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: govbr-eval
          persist-credentials: false
      - name: Node 24.21.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"
      - name: Checkout govbr-telas (por SHA)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: nathlia/govbr-telas
          ref: ${{ inputs.telas_sha }}
          path: govbr-telas
          token: ${{ secrets.GOVBR_LEITURA_TOKEN }}
          persist-credentials: false
      - name: Checkout govbr-ds-validator (por SHA)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: nathlia/govbr-ds-validator
          ref: ${{ inputs.validator_sha }}
          path: govbr-ds-validator
          token: ${{ secrets.GOVBR_LEITURA_TOKEN }}
          persist-credentials: false
      # Fonte que o ESLint lê (tela A): o commit do corpus que o site-manifest registra como origem.
      - name: Checkout govbr-corpus (commit de origem do site)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: nathlia/govbr-corpus
          ref: ${{ needs.preparar.outputs.corpus_sha }}
          path: govbr-corpus
          token: ${{ secrets.GOVBR_LEITURA_TOKEN }}
          persist-credentials: false
          sparse-checkout: src
      - name: Dependências do govbr-eval
        run: bash govbr-eval/scripts/ci/t4.sh instalar-eval
      - name: Compilar o oráculo
        run: bash govbr-eval/scripts/ci/t4.sh compilar-validador
      - name: Chromium do Playwright (com dependências do sistema)
        run: bash govbr-eval/scripts/ci/t4.sh instalar-navegador
      - name: Manifesto de coleta do disparo
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: manifesto-coleta
          path: ${{ runner.temp }}/manifesto/
      - name: Linha de base e registro
        id: linha
        env:
          TELA: ${{ inputs.tela }}
          REFAZER_DE: ${{ inputs.refazer_linha_de_base_de }}
          MOTIVO_REFAZER: ${{ inputs.motivo_refazer }}
        run: bash govbr-eval/scripts/ci/t4.sh linha-de-base
      - name: Resumo da linha de base
        if: always()
        run: bash govbr-eval/scripts/ci/t4.sh resumo-linha-de-base
      - name: Subir a linha de base (também em falha)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linha-de-base
          path: ${{ runner.temp }}/linha-de-base/
          retention-days: 14
          if-no-files-found: warn

  arquivar:
    name: Arquivar no govbr-resultados
    needs: [preparar, coleta, linhas-de-base]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout govbr-eval (commit do disparo)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: govbr-eval
          persist-credentials: false
      - name: Node 24.21.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"
      - name: Checkout govbr-resultados (main)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: nathlia/govbr-resultados
          ref: main
          path: govbr-resultados
          token: ${{ secrets.GOVBR_RESULTADOS_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout govbr-telas (por SHA; o site congelado vai para o arquivo, T8a.1)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: nathlia/govbr-telas
          ref: ${{ inputs.telas_sha }}
          path: govbr-telas
          token: ${{ secrets.GOVBR_LEITURA_TOKEN }}
          persist-credentials: false
      - name: Dependências do govbr-eval
        run: bash govbr-eval/scripts/ci/t4.sh instalar-eval
      - name: Baixar o manifesto
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: manifesto-coleta
          path: ${{ runner.temp }}/entrada/manifesto/
      - name: Baixar o pacote
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pacote
          path: ${{ runner.temp }}/entrada/pacote/
      - name: Baixar a linha de base
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linha-de-base
          path: ${{ runner.temp }}/entrada/linha-de-base/
      - name: Gravar no arquivo (caminho imutável, índice, tar.gz de evidências)
        env:
          ENTRADAS: ${{ toJSON(inputs) }}
          JOBS: ${{ toJSON(needs) }}
          GOVBR_RESULTADOS_TOKEN: ${{ secrets.GOVBR_RESULTADOS_TOKEN }}
        run: bash govbr-eval/scripts/ci/t4.sh arquivar
      - name: Anexar evidências na Release e conferir baixando de volta
        env:
          GOVBR_RESULTADOS_TOKEN: ${{ secrets.GOVBR_RESULTADOS_TOKEN }}
          REPO_RESULTADOS: nathlia/govbr-resultados
        run: bash govbr-eval/scripts/ci/t4.sh anexar
      - name: Publicar (commit + push, índice refeito a cada tentativa)
        env:
          GOVBR_RESULTADOS_TOKEN: ${{ secrets.GOVBR_RESULTADOS_TOKEN }}
        run: bash govbr-eval/scripts/ci/t4.sh publicar
      - name: Resumo do arquivamento
        if: always()
        env:
          CAMPANHA: ${{ inputs.campanha }}
          SLOT: ${{ inputs.slot }}
          PAR: ${{ needs.preparar.outputs.par }}
          TENTATIVA: ${{ needs.preparar.outputs.tentativa }}
          TELA: ${{ inputs.tela }}
          BRACO: ${{ needs.preparar.outputs.braco }}
          MODELO: ${{ needs.preparar.outputs.modelo }}
          ESFORCO: ${{ needs.preparar.outputs.esforco }}
          ETAPAS: ${{ inputs.etapas }}
        run: bash govbr-eval/scripts/ci/t4.sh resumo-arquivo
