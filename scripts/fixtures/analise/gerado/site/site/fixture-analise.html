<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Tela fixture da análise (sintética)</title>
<style>
  body { font-family: sans-serif; margin: 24px; color: #222; background: #fff; }
  .fx-aviso { color: #555; }
  .fx-botao { background: #ff00ff; color: #fff; border: 0; padding: 8px 16px; }
  form { display: flex; gap: 12px; align-items: center; }
</style>
</head>
<body>
<main>
  <h1 id="fx-titulo">Tela fixture — sintética</h1>
  <p class="fx-aviso">FIXTURE SINTÉTICA para testar a análise determinística (T6). Não é tela do experimento.</p>
  <form>
    <input id="fx-campo" type="text" placeholder="campo sintético">
    <button id="fx-botao" class="fx-botao" type="button">Enviar</button>
    <a id="fx-link" href="#fx-titulo">clique aqui</a>
  </form>
</main>
</body>
</html>
